# promptfoo configuration for Baseline Security Checks skill evaluation
# See: https://www.promptfoo.dev/docs/configuration/guide

prompts:
  - file://../prompt/system.md
  - file://../prompt/user.md

providers:
  - id: openai:gpt-4o
    config:
      temperature: 0.1
      max_tokens: 2000

  - id: anthropic:claude-3-5-sonnet-20241022
    config:
      temperature: 0.1
      max_tokens: 2000

tests:
  - description: SQL Injection Detection (Happy Path)
    vars:
      diff: file://../fixtures/01-sql-injection-happy.md
    assert:
      - type: llm-rubric
        value: |
          The output must identify a SQL injection vulnerability.
          Score 1 if the output mentions SQL injection or query construction risks.
          Score 0 otherwise.

      - type: contains
        value: 'SQL injection'

      - type: contains
        value: 'Severity: major'

      - type: llm-rubric
        value: |
          The output must provide a concrete fix suggestion.
          Score 1 if it suggests parameterized queries or prepared statements.
          Score 0 otherwise.

      - type: similar
        value: file://../golden/01-sql-injection-happy.md
        threshold: 0.7

  - description: False Positive Avoidance (Test File)
    vars:
      diff: file://../fixtures/02-false-positive-test.md
    assert:
      - type: llm-rubric
        value: |
          The output should NOT flag test file credentials as security issues.
          Score 1 if it recognizes this is test data and does not raise major security concerns.
          Score 0 if it incorrectly flags test credentials as vulnerabilities.

      - type: not-contains
        value: 'Severity: major'

      - type: llm-rubric
        value: |
          The output should acknowledge the test context.
          Score 1 if it mentions tests, test files, or mock data.
          Score 0 otherwise.

  - description: Open Redirect via Backslash in Same-Host Check (Happy Path)
    vars:
      diff: file://../fixtures/03-open-redirect-backslash-happy.md
    assert:
      - type: llm-rubric
        value: |
          The output must identify an open redirect on `header('Location: ' . $back);`.
          Score 1 if it explains that a value containing `\` (e.g. `http://evil.example\@self.example/`)
          passes the `parse_url` host check while browsers navigate to `evil.example`,
          and suggests a same-site relative-path allowlist or an origin comparison
          (rejecting `\` alone is not sufficient).
          Score 0 otherwise.

      - type: contains
        value: 'Severity: major'

      - type: similar
        value: file://../golden/03-open-redirect-backslash-happy.md
        threshold: 0.7

  - description: False Positive Avoidance (Same-Site Relative Path Allowlist)
    vars:
      diff: file://../fixtures/04-open-redirect-relative-path-allowlist-guard.md
    assert:
      - type: llm-rubric
        value: |
          The output should NOT report an open redirect, because `$back` is limited to
          same-site relative paths (a single leading `/`, not `//` or `/\`, no `\`, no control characters).
          Score 1 if no open redirect finding is produced; 0 otherwise.

      - type: not-contains
        value: 'Severity: major'

  - description: Open Redirect via Null Host Despite Backslash Rejection (Happy Path)
    vars:
      diff: file://../fixtures/05-open-redirect-null-host-bypass-happy.md
    assert:
      - type: llm-rubric
        value: |
          The output must identify an open redirect on `header('Location: ' . $back);`
          even though `\` and `%5C` are rejected. Score 1 if it explains that values
          without a `parse_url` host (e.g. `http:evil.example` or a tab-prefixed `//evil.example`)
          pass the check but resolve to `evil.example` in browsers, and suggests a
          relative-path allowlist or an origin comparison. Score 0 otherwise.

      - type: contains
        value: 'Severity: major'

      - type: similar
        value: file://../golden/05-open-redirect-null-host-bypass-happy.md
        threshold: 0.7

defaultTest:
  options:
    provider: openai:gpt-4o

outputPath: eval/results.json
