name: Phase 4 contract cleanup

on:
  push:
    branches:
      - feat/2278-security-coverage-critic

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2278-security-coverage-critic
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Align output contract
        run: |
          perl -0pi -e 's/- category\n- blocking\n- evidence_missing\n- resolution/- category\n- severity\n- blocking\n- evidence_missing\n- resolution/' skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md
          perl -0pi -e 's/5\. \*\*Coverage critic observations\*\*/5. **Unverified \/ Residual Risk — Unknown Coverage**/' skills/agent-skills/river-review-security-audit/SKILL.md
          grep -q -- '- severity' skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md
          grep -q 'Unverified / Residual Risk — Unknown Coverage' skills/agent-skills/river-review-security-audit/SKILL.md

      - name: Regenerate skill artifacts
        run: |
          npm run skills:catalog
          npm run skills:manifest

      - name: Remove temporary workflow
        run: rm .github/workflows/phase4-contract-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): align phase4 output contract'
          git push origin HEAD:feat/2278-security-coverage-critic
