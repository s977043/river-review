name: Temporary prepare Feedback approval v2

on:
  push:
    branches:
      - feat/2591-resolution-feedback-approval-v2
    paths:
      - src/lib/review-resolution-feedback-approval.mjs
      - tests/review-resolution-feedback-approval.test.mjs
      - .github/workflows/tmp-prepare-feedback-approval-v2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2591-resolution-feedback-approval-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format approval source and tests
        run: >-
          npx --no-install prettier --write
          src/lib/review-resolution-feedback-approval.mjs
          tests/review-resolution-feedback-approval.test.mjs
      - name: Focused tests
        run: node --test tests/review-resolution-feedback-approval.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add src/lib/review-resolution-feedback-approval.mjs tests/review-resolution-feedback-approval.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(resolution): format approval source and tests"
          git push origin HEAD:feat/2591-resolution-feedback-approval-v2
