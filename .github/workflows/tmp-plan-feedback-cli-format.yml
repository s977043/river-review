name: Temp Plan Feedback CLI Formatter (delete before merge)
on:
  pull_request:
    branches:
      - main
      - feat/validated-plan-feedback-projection-20261009
permissions:
  contents: read
jobs:
  formatting-snapshot:
    if: github.head_ref == 'feat/plan-feedback-cli-opt-in-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Prettier
        run: npm ci --ignore-scripts
      - name: Emit formatted sources to logs (no write)
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const paths = [
            'docs/review/interactive-plan-feedback.md',
            'src/cli.mjs',
            'src/cli/commands/run.mjs',
            'src/cli/parse/options.mjs',
            'tests/cli-plan-feedback-optin.test.mjs'
          ];
          for (const file of paths) {
            const result = spawnSync('./node_modules/.bin/prettier', ['--stdin-filepath', file], {
              input: readFileSync(file), encoding: 'utf8', maxBuffer: 10 * 1024 * 1024
            });
            if (result.status !== 0) throw new Error(file + ': ' + result.stderr);
            process.stdout.write('FORMATTED_FILE ' + file + ' ' +
              Buffer.from(result.stdout, 'utf8').toString('base64') + '\n');
          }
          NODE
