name: Temporary Format Slice C

on:
  push:
    branches:
      - feat/review-coverage-file-scope-2212

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/review-coverage-file-scope-2212
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize and format Slice C files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix-dashes.mjs \
            docs/development/review-coverage-contract.md \
            docs/development/review-coverage-phase1-slice-c-plan.md
          npx --no-install prettier --write \
            docs/development/review-coverage-contract.md \
            docs/development/review-coverage-phase1-slice-c-plan.md \
            src/lib/local-runner.mjs \
            tests/review-file-scope.test.mjs

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/development/review-coverage-contract.md \
            docs/development/review-coverage-phase1-slice-c-plan.md \
            src/lib/local-runner.mjs \
            tests/review-file-scope.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize Review Coverage Slice C" -m "Co-Authored-By: GPT-5.6 Sol <noreply@openai.com>"
          git push origin HEAD:feat/review-coverage-file-scope-2212
