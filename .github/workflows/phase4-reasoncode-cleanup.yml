name: Phase 4 reason code cleanup

on:
  push:
    branches:
      - feat/2278-security-coverage-critic

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2278-security-coverage-critic
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Align reason-code wording
        run: |
          perl -0pi -e 's/`out_of_scope` or `not_applicable` conflicts with reconnaissance evidence/`out_of_scope` with `reasonCode: not_applicable` conflicts with reconnaissance evidence/' skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md
          grep -q 'reasonCode: not_applicable' skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md

      - name: Regenerate skill artifacts
        run: |
          npm run skills:catalog
          npm run skills:manifest

      - name: Remove temporary workflow
        run: rm .github/workflows/phase4-reasoncode-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): distinguish coverage state from reason code'
          git push origin HEAD:feat/2278-security-coverage-critic
