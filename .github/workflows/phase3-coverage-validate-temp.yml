name: Temp Validate Phase3 Security Audit Coverage

on:
  push:
    branches:
      - feat/2267-security-audit-coverage
    paths:
      - .github/workflows/phase3-coverage-validate-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2267-security-audit-coverage
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Format Phase 3 files
        run: |
          npx prettier --write \
            schemas/security-audit-coverage.schema.json \
            src/lib/security-audit-coverage.mjs \
            tests/security-audit-coverage.test.mjs \
            docs/development/2267-phase3-security-audit-coverage.md

      - name: Validate Phase 3 contract
        run: |
          npx prettier --check \
            schemas/security-audit-coverage.schema.json \
            src/lib/security-audit-coverage.mjs \
            tests/security-audit-coverage.test.mjs \
            docs/development/2267-phase3-security-audit-coverage.md
          node --experimental-test-isolation=none --test tests/security-audit-coverage.test.mjs

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/security-audit-coverage.schema.json \
            src/lib/security-audit-coverage.mjs \
            tests/security-audit-coverage.test.mjs \
            docs/development/2267-phase3-security-audit-coverage.md
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style(security): format phase3 coverage contract"
          git push origin HEAD:feat/2267-security-audit-coverage
