name: Temporary Phase 5 Prettier

on:
  push:
    branches:
      - feat/2252-heuristic-adapter
    paths:
      - .github/workflows/tmp-prettier-phase5.yml

permissions:
  contents: write

concurrency:
  group: tmp-prettier-phase5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2252-heuristic-adapter

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository Prettier config
        run: npx prettier --write tests/heuristic-detection-adapter.test.mjs

      - name: Verify scope and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "tests/heuristic-detection-adapter.test.mjs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/heuristic-detection-adapter.test.mjs
          git commit -m "style(heuristics): format adapter test with prettier"
          git push origin HEAD:feat/2252-heuristic-adapter
