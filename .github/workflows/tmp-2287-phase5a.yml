name: Temporary Phase 5A validation

on:
  push:
    branches:
      - feat/2287-finding-verifier-independence

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test tests/finding-verification-independence.test.mjs tests/finding-critic.test.mjs tests/finding-critic-runner.test.mjs
      - run: npx prettier --check src/lib/finding-verification-independence.mjs tests/finding-verification-independence.test.mjs
      - run: npm run lint:code
