name: Temporary prepare Critic Gate v2

on:
  push:
    branches:
      - feat/2343-critic-validation-gate-v2
    paths:
      - src/lib/gate-decision.mjs
      - src/lib/review-plan.mjs
      - src/lib/run-gate.mjs
      - tests/critic-validation-gate.test.mjs
      - docs/development/2343-critic-validation-gate.md
      - .github/workflows/tmp-prepare-critic-gate-v2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2343-critic-validation-gate-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format added sources and docs
        run: >-
          npx --no-install prettier --write
          src/lib/gate-decision.mjs
          src/lib/review-plan.mjs
          src/lib/run-gate.mjs
          tests/critic-validation-gate.test.mjs
          docs/development/2343-critic-validation-gate.md
      - name: Unit regression
        run: node --test tests/critic-validation-gate.test.mjs
      - name: Rebuild Action distribution
        run: npm run build:action
      - name: Commit source format and generated dist
        shell: bash
        run: |
          set -euo pipefail
          git add src/lib/gate-decision.mjs src/lib/review-plan.mjs src/lib/run-gate.mjs             tests/critic-validation-gate.test.mjs docs/development/2343-critic-validation-gate.md             runners/github-action/dist/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(gate): format and rebuild Critic validation dist"
          git push origin HEAD:feat/2343-critic-validation-gate-v2
