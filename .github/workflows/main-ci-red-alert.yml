name: Main CI Red Alert

# Experiment: a red CI on main is noticed within 10 minutes. When the `CI`
# workflow (.github/workflows/test.yml) fails on main, open or update a
# `ci-red` issue; when a later main run succeeds, close it. Rollback: disable
# this workflow. Logic lives in scripts/main-ci-red-alert.sh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      simulate_conclusion:
        description: Conclusion to simulate
        type: choice
        options: [failure, success]
        required: true
      simulate_sha:
        description: Full head sha to report
        type: string
        required: true

permissions:
  issues: write
  actions: read
  contents: read

# One alert at a time, so two red runs cannot both miss the open issue and
# create duplicates. cancel-in-progress: false keeps the running alert alive,
# but GitHub keeps at most one pending run per group: a newer pending run
# replaces an older pending one. The end state therefore tracks the latest
# result, not every intermediate one.
concurrency:
  group: main-ci-red-alert
  cancel-in-progress: false

jobs:
  alert:
    name: Alert on main CI result
    # Branch / event filtering happens in the script from the event payload, so
    # this file never names the run's head ref (see the script header).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["failure","success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Open, update, or close the ci-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SIMULATE_CONCLUSION: ${{ inputs.simulate_conclusion }}
          SIMULATE_SHA: ${{ inputs.simulate_sha }}
          SIMULATE_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2} (simulated)', github.server_url, github.repository, github.run_id) }}
        run: bash scripts/main-ci-red-alert.sh
