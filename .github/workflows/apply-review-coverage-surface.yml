name: Apply Review Coverage Surface Patch

on:
  push:
    branches:
      - feat/review-coverage-surface-2212

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic patch
        run: node scripts/apply-review-coverage-surface-patch.mjs

      - name: Normalize changed files
        run: |
          npx prettier --write \
            src/lib/reviewer-orchestrator.mjs \
            src/lib/local-runner.mjs \
            src/lib/result-store.mjs \
            src/cli/render.mjs \
            schemas/output.schema.json \
            pages/reference/stable-interfaces.md \
            tests/review-coverage-surface.test.mjs
          node scripts/fix-dashes.mjs
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/reviewer-orchestrator.mjs \
            src/lib/local-runner.mjs \
            src/lib/result-store.mjs \
            src/cli/render.mjs \
            schemas/output.schema.json \
            pages/reference/stable-interfaces.md \
            tests/review-coverage-surface.test.mjs
          git commit -m "feat(review): expose Review Coverage observation surfaces" || exit 0
          git push origin HEAD:feat/review-coverage-surface-2212
