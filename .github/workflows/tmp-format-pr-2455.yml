name: Temporary format PR 2455

on:
  push:
    branches:
      - docs/2455-concern-map-phase0
    paths:
      - docs/adr/014-review-concern-map.md
      - docs/development/2455-phase0-gap-analysis.md
      - .github/workflows/tmp-format-pr-2455.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/2455-concern-map-phase0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format target docs
        run: npx --no-install prettier --write docs/adr/014-review-concern-map.md docs/development/2455-phase0-gap-analysis.md

      - name: Verify formatter output
        run: npx --no-install prettier --check docs/adr/014-review-concern-map.md docs/development/2455-phase0-gap-analysis.md

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet -- docs/adr/014-review-concern-map.md docs/development/2455-phase0-gap-analysis.md; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr/014-review-concern-map.md docs/development/2455-phase0-gap-analysis.md
          git commit -m "style(docs): apply prettier to concern map docs"
          git push origin HEAD:docs/2455-concern-map-phase0
