name: Temporary format PR 2508

on:
  push:
    branches:
      - feat/2507-concern-eval-phase2
    paths:
      - src/lib/review-concern-eval.mjs
      - tests/fixtures/review-concern/phase2-eval-cases.json
      - tests/review-concern-eval.test.mjs
      - docs/development/2455-phase2-concern-evaluation.md
      - .github/workflows/tmp-format-pr-2508.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2507-concern-eval-phase2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format target files
        run: npx --no-install prettier --write src/lib/review-concern-eval.mjs tests/fixtures/review-concern/phase2-eval-cases.json tests/review-concern-eval.test.mjs docs/development/2455-phase2-concern-evaluation.md

      - name: Verify formatter output
        run: npx --no-install prettier --check src/lib/review-concern-eval.mjs tests/fixtures/review-concern/phase2-eval-cases.json tests/review-concern-eval.test.mjs docs/development/2455-phase2-concern-evaluation.md

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/review-concern-eval.mjs \
            tests/fixtures/review-concern/phase2-eval-cases.json \
            tests/review-concern-eval.test.mjs \
            docs/development/2455-phase2-concern-evaluation.md
          git commit -m "style(concern-eval): apply repository formatting"
          git push origin HEAD:feat/2507-concern-eval-phase2
