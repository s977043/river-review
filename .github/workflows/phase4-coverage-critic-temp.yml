name: Temp Wire Phase4 Coverage Critic

on:
  push:
    branches:
      - feat/2278-security-audit-coverage-critic
    paths:
      - .github/workflows/phase4-coverage-critic-temp.yml

permissions:
  contents: write

jobs:
  wire-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2278-security-audit-coverage-critic
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Wire Phase 4 profiles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          unknown = Path('skills/agent-skills/unknown-coverage-review/SKILL.md')
          text = unknown.read_text()
          replacements = [
              ("version: '0.1.0'", "version: '0.2.0'"),
              (
                  '## Pre-execution Gate / 発火条件\n',
                  '''## Profile Selection\n\nSelect exactly one execution profile before applying the evidence-sufficiency checks:\n\n```text\nprofile: generic | security-audit\n```\n\n- `generic` is the existing diff/PR synthesis profile. Its diff-oriented Pre-execution Gate, output mapping, and report-only behavior remain unchanged.\n- `security-audit` is only for an explicit `river-review-security-audit` focused/full-audit flow with a shape-valid `SecurityAuditCoverage` ledger and reconnaissance evidence. It does not require a current diff because repository/subsystem audits may exist without one.\n\nDo not select `security-audit` from keyword routing or normal PR security review.\nIts detailed evidence-sufficiency contract lives in [SECURITY-AUDIT-PROFILE.md](./references/SECURITY-AUDIT-PROFILE.md).\n\n## Generic Profile Pre-execution Gate / 発火条件\n'''
              ),
              (
                  '## Output / 出力\n',
                  '''## Security Audit Profile\n\nFor `profile: security-audit`, use [SECURITY-AUDIT-PROFILE.md](./references/SECURITY-AUDIT-PROFILE.md).\nThat profile evaluates semantic evidence sufficiency only after deterministic `SecurityAuditCoverage` validation.\nIt remains report-only, does not duplicate finding verification, and does not directly change Gate behavior.\n\n## Generic Profile Output / 出力\n'''
              ),
              (
                  '- [DELEGATION.md](./references/DELEGATION.md) — 既存 skill への委譲表・証拠要件・分界\n',
                  '''- [DELEGATION.md](./references/DELEGATION.md) — 既存 skill への委譲表・証拠要件・分界\n- [SECURITY-AUDIT-PROFILE.md](./references/SECURITY-AUDIT-PROFILE.md) — SecurityAuditCoverage の semantic evidence-sufficiency profile\n- [security-audit-profile-fixtures.json](./references/security-audit-profile-fixtures.json) — Phase 4 positive/false-positive contract fixtures\n'''
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'unknown-coverage expected text not found: {old!r}')
              text = text.replace(old, new, 1)
          unknown.write_text(text)

          delegation = Path('skills/agent-skills/unknown-coverage-review/references/DELEGATION.md')
          text = delegation.read_text()
          old = '- `plan` / `review-self` 欠損時は該当観点を `skippedSkills` に記録してデグレードする（PlanGate 非依存）。\n'
          new = old + '\nこの Gate は `profile: generic` 専用である。`profile: security-audit` は diff を必須にせず、[SECURITY-AUDIT-PROFILE.md](./SECURITY-AUDIT-PROFILE.md) の explicit audit context / SecurityAuditCoverage / reconnaissance evidence 条件に従う。どちらの profile でも defect は既存 security skill へ委譲し、本観点は evidence-sufficiency の残余だけを扱う。\n'
          if old not in text:
              raise SystemExit('delegation insertion point not found')
          delegation.write_text(text.replace(old, new, 1))

          audit = Path('skills/agent-skills/river-review-security-audit/SKILL.md')
          text = audit.read_text()
          replacements = [
              ('version: 0.3.0', 'version: 0.4.0'),
              ('Version 0.3.0 is source-only.', 'Version 0.4.0 is source-only.'),
              (
                  '  -> observe-only SecurityAuditCoverage ledger\n  -> existing verification path\n  -> audit summary',
                  '  -> observe-only SecurityAuditCoverage ledger\n  -> unknown-coverage-review (security-audit profile)\n  -> existing verification path\n  -> audit summary'
              ),
              (
                  '### 9. Report without claiming safety\n',
                  '''### 9. Critique semantic coverage evidence sufficiency\n\nAfter the `SecurityAuditCoverage` ledger passes its deterministic schema/semantic validation, invoke `unknown-coverage-review` with `profile: security-audit` before finalizing the audit summary.\n\nUse `skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md` as the profile contract. The critic checks only residual evidence sufficiency:\n\n- missing applicable semantic surfaces supported by reconnaissance evidence;\n- schema-valid `covered` units whose source evidence does not substantiate the claimed subsystem/boundary/class;\n- suspicious exclusion/defer/block patterns that may hide uninvestigated material surfaces;\n- prose that turns zero findings, coverage counters, or `full-audit` into a safety guarantee.\n\nDo not mechanically require every attack class.\nDo not duplicate `validateSecurityAuditCoverageSemantics()`, finding verification, Semantic Precision, or Gate policy.\nPhase 4 remains report-only: Gate behavior is unchanged.\n\n### 10. Report without claiming safety\n'''
              ),
              (
                  '- `skills/agent-skills/river-review-security-audit/references/attack-classes.json`\n',
                  '- `skills/agent-skills/river-review-security-audit/references/attack-classes.json`\n- `skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md`\n'
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'audit expected text not found: {old!r}')
              text = text.replace(old, new, 1)
          audit.write_text(text)
          PY

      - name: Format Phase 4 files
        run: |
          npx prettier --write \
            skills/agent-skills/unknown-coverage-review/SKILL.md \
            skills/agent-skills/unknown-coverage-review/references/DELEGATION.md \
            skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md \
            skills/agent-skills/unknown-coverage-review/references/security-audit-profile-fixtures.json \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            tests/security-audit-coverage-critic-contract.test.mjs

      - name: Regenerate skill-derived artifacts
        run: |
          npm run skills:registry
          npm run skills:catalog
          npm run skills:manifest

      - name: Validate Phase 4 contract
        run: |
          node --experimental-test-isolation=none --test tests/security-audit-coverage-critic-contract.test.mjs
          npm run agent-skills:validate
          npm run skills:registry:check
          npm run skills:catalog:check
          npm run skills:manifest:check
          npm run format:check

      - name: Commit Phase 4 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/agent-skills/unknown-coverage-review/SKILL.md \
            skills/agent-skills/unknown-coverage-review/references/DELEGATION.md \
            skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md \
            skills/agent-skills/unknown-coverage-review/references/security-audit-profile-fixtures.json \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            tests/security-audit-coverage-critic-contract.test.mjs \
            skills/registry.yaml \
            pages/reference/skills-catalog.md \
            docs/data/skill-manifest.json
          if git diff --cached --quiet; then
            echo "No Phase 4 changes to commit."
            exit 0
          fi
          git commit -m "feat(security): add security audit coverage critic profile"
          git push origin HEAD:feat/2278-security-audit-coverage-critic
