name: Temporary prepare PR 2568

on:
  push:
    branches:
      - feat/2568-concern-interaction-planner
    paths:
      - src/lib/review-concern-interaction.mjs
      - src/lib/local-runner.mjs
      - tests/review-concern-interaction.test.mjs
      - tests/review-concern-local-runner.test.mjs
      - docs/development/2455-phase5a-concern-interaction-planner.md
      - .github/workflows/tmp-prepare-pr-2568.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2568-concern-interaction-planner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Format source and docs
        run: >-
          npx --no-install prettier --write
          src/lib/review-concern-interaction.mjs
          src/lib/local-runner.mjs
          tests/review-concern-interaction.test.mjs
          tests/review-concern-local-runner.test.mjs
          docs/development/2455-phase5a-concern-interaction-planner.md
      - name: Rebuild Action dist
        run: npm run build:action
      - name: Verify formatting
        run: >-
          npx --no-install prettier --check
          src/lib/review-concern-interaction.mjs
          src/lib/local-runner.mjs
          tests/review-concern-interaction.test.mjs
          tests/review-concern-local-runner.test.mjs
          docs/development/2455-phase5a-concern-interaction-planner.md
      - name: Commit prepared files
        shell: bash
        run: |
          set -euo pipefail
          git add             src/lib/review-concern-interaction.mjs             src/lib/local-runner.mjs             tests/review-concern-interaction.test.mjs             tests/review-concern-local-runner.test.mjs             docs/development/2455-phase5a-concern-interaction-planner.md             runners/github-action/dist/
          if git diff --cached --quiet; then
            echo "No preparation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(concern): prepare Phase 5A delivery"
          git push origin HEAD:feat/2568-concern-interaction-planner
