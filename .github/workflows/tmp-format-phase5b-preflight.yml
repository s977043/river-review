name: Temporary format Phase 5B preflight

on:
  push:
    branches:
      - feat/2585-integration-preflight
    paths:
      - src/lib/review-concern-integration-preflight.mjs
      - tests/review-concern-integration-preflight.test.mjs
      - .github/workflows/tmp-format-phase5b-preflight.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2585-integration-preflight
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format code and tests
        run: >-
          npx --no-install prettier --write
          src/lib/review-concern-integration-preflight.mjs
          tests/review-concern-integration-preflight.test.mjs
      - name: Verify formatting
        run: >-
          npx --no-install prettier --check
          src/lib/review-concern-integration-preflight.mjs
          tests/review-concern-integration-preflight.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/review-concern-integration-preflight.mjs tests/review-concern-integration-preflight.test.mjs; then
            echo "No format changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/review-concern-integration-preflight.mjs tests/review-concern-integration-preflight.test.mjs
          git commit -m "style(concern): format Phase 5B preflight"
          git push origin HEAD:feat/2585-integration-preflight
