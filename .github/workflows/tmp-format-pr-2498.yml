name: Temporary format PR 2498

on:
  push:
    branches:
      - feat/2455-concern-analyzer-poc
    paths:
      - docs/development/2455-phase1-concern-analyzer.md
      - src/lib/local-runner.mjs
      - src/lib/review-concern-analyzer.mjs
      - tests/review-concern-analyzer.test.mjs
      - tests/review-concern-local-runner.test.mjs
      - .github/workflows/tmp-format-pr-2498.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/2455-concern-analyzer-poc
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format target files
        run: npx --no-install prettier --write docs/development/2455-phase1-concern-analyzer.md src/lib/local-runner.mjs src/lib/review-concern-analyzer.mjs tests/review-concern-analyzer.test.mjs tests/review-concern-local-runner.test.mjs

      - name: Rebuild action dist
        run: npm run build:action

      - name: Verify formatter output
        run: npx --no-install prettier --check docs/development/2455-phase1-concern-analyzer.md src/lib/local-runner.mjs src/lib/review-concern-analyzer.mjs tests/review-concern-analyzer.test.mjs tests/review-concern-local-runner.test.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting or dist changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/2455-phase1-concern-analyzer.md \
            src/lib/local-runner.mjs \
            src/lib/review-concern-analyzer.mjs \
            tests/review-concern-analyzer.test.mjs \
            tests/review-concern-local-runner.test.mjs \
            runners/github-action/dist/index.mjs \
            runners/github-action/dist/index.mjs.map
          git commit -m "style(concern): apply repository formatting"
          git push origin HEAD:feat/2455-concern-analyzer-poc
