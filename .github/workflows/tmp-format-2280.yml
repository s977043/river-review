name: Temporary Format 2280

on:
  push:
    branches:
      - fix/2280-git-diff-boundary

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/2280-git-diff-boundary
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx --no-install prettier --write src/lib/diff-processor.mjs tests/diff-header-triple.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/diff-processor.mjs tests/diff-header-triple.test.mjs
          git commit -m "style(diff): format #2280 changes"
          git push origin HEAD:fix/2280-git-diff-boundary
