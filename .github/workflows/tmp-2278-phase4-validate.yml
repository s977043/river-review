name: Temporary Phase 4 Coverage Critic Validation

# Temporary branch-only validator for #2278. Remove before opening the PR.
on:
  push:
    branches:
      - feat/2278-security-coverage-critic

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2278-security-coverage-critic
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize Phase 4 files
        run: |
          npm run fix:dashes
          npx prettier --write \
            skills/agent-skills/unknown-coverage-review/SKILL.md \
            skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            tests/security-audit-coverage-critic-profile.test.mjs \
            docs/development/2267-phase4-security-coverage-critic.md

      - name: Regenerate skill artifacts
        run: |
          npm run skills:manifest
          npm run skills:catalog
          npm run skills:registry

      - name: Run security Phase 2-4 contract tests
        run: |
          node --experimental-test-isolation=none --test \
            tests/security-attack-class-registry.test.mjs \
            tests/security-audit-coverage.test.mjs \
            tests/security-audit-coverage-critic-profile.test.mjs

      - name: Validate agent skills and references
        run: |
          npm run agent-skills:validate
          npm run skills:validate:refs

      - name: Check generated artifacts
        run: |
          npm run skills:manifest:check
          npm run skills:catalog:check
          npm run skills:registry:check
          npm run check:dashes
          npx prettier --check \
            skills/agent-skills/unknown-coverage-review/SKILL.md \
            skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            tests/security-audit-coverage-critic-profile.test.mjs \
            docs/development/2267-phase4-security-coverage-critic.md

      - name: Commit normalized and generated artifacts
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs \
            pages/reference/skills-catalog.md \
            skills/registry.yaml \
            skills/agent-skills/unknown-coverage-review/SKILL.md \
            skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            tests/security-audit-coverage-critic-profile.test.mjs
          git commit -m 'chore: normalize phase4 coverage critic artifacts'
          git push origin HEAD:feat/2278-security-coverage-critic
