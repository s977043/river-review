name: Blocked Label Guard

# マージ阻止ラベル（`blocked` 等）が付いた PR のマージを機械的に止めるガード。
# 2026-08-04 に #1746 と #1761 の 2 回、`blocked` ラベルと未解決の指摘を付けたままの
# PR がマージされた。1 回目の対策として docs/governance.md に確認手順を足したが、
# その約 5 時間後に 2 回目が起きている。人が読む手順ではマージ操作を止められないため、
# ラベルの有無を CI の成否として表現する。
#
# labeled / unlabeled だけでなく opened / reopened / synchronize でも走らせる。
# ラベル付与後に push された場合、labeled イベントだけでは古い成功結果が
# 最新コミットに対する判定として残らないため、再評価の機会を確保する。
#
# merge_group でも走らせる。マージキューでは必須チェックがキュー内の一時ブランチに対して
# 再実行され、`merge_group` を持たないワークフローの context は一度も報告されないため
# キューが詰まる（https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue）。
#
# merge_group 時に「no-op で pass」にはしない。GitHub のドキュメントが挙げるキュー除外の
# 事由は「CI の失敗」「タイムアウト」「API / UI からの除外要求」「自動解決できない
# branch protection の失敗」の 4 つで、**ラベルの付与は含まれない**。したがって
# 「キューへ入れたあとに `blocked` を付けた」PR はキューに残り続ける。no-op pass にすると
# 次の失敗シナリオが素通りする:
#
#   1. 指摘者がまだラベルを付けていない状態で PR がキューへ入る
#   2. 指摘者が未解決の指摘に気づき `blocked` を付ける（PR イベント側のガードは赤くなるが、
#      キュー内の一時ブランチに対する判定はそれとは別の check-run である）
#   3. merge_group のガードが no-op pass を返す → そのまま main へマージされる
#
# これは #1746 / #1761 と同型の事故にあたる。そこで merge_group では、一時ブランチ名
# （`refs/heads/gh-readonly-queue/<base>/pr-<番号>-<base sha>`）から PR 番号を取り出し、
# API で現在のラベルを読んで同じ判定を行う。
#
# 1 つの merge group が複数の PR を含む場合、head_ref が名指しするのは最後に積まれた 1 本
# だけである。**各 PR は自分の entry で必ず一度は判定される**ので、group 内の先行 PR は
# その PR 自身の entry の check-run が担保する。
#
# 残る窓は 1 つある。ある PR のキュー entry のガードが pass で確定したあとにラベルが付いた
# 場合、その entry は再評価されない。ラベルを付けた側が UI / API でキューから除外する運用が
# 必要になる（docs/governance.md「PR レビューとマージ」）。

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:

# 既定の GITHUB_TOKEN 権限はこのリポジトリでは write（`gh api
# repos/s977043/river-review/actions/permissions/workflow` で確認）。
# top-level では最小権限まで絞り、merge_group 時のラベル取得に必要な
# `pull-requests: read` だけをジョブ側で足す。
permissions:
  contents: read

# concurrency は意図的に設定しない。
# このジョブは event payload の labels を読んで終了するだけで、API 呼び出しも
# 共有状態への書き込みも無いため、同一 PR で並行実行しても害が無い。実行時間も
# 実測で 5〜15 秒（成功 30 件、中央値 7 秒）と短く、重複コストは無視できる。
#
# 逆に concurrency を設定すると `cancelled` の check-run が残り、必須チェックとして
# マージを止める（#1778）。これは `cancel-in-progress: false` でも避けられない。
# GitHub の仕様では、グループ内に pending の run がある状態で新しい run が queue に
# 入ると「既存の pending は cancel され、新しい run が置き換わる」ためである
# （https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency）。
# つまり cancel されるタイミングが in-progress から pending へ移るだけで、
# `cancelled` の check-run が残る事象そのものは消えない。
# 必須チェックである以上、pass / fail 以外の結論を一切生じさせないことが要件になる。

jobs:
  blocked-label-guard:
    name: Blocked label guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # merge_group では event payload に labels が無いため、PR のラベルを API で読む。
      pull-requests: read
    steps:
      - name: Check merge-blocking labels
        env:
          # 阻止ラベルの定義箇所はここ 1 つ。増やすときはカンマ区切りで足す
          # （例: 'blocked,do-not-merge'）。比較は前後空白除去 + 小文字化で行う。
          BLOCKING_LABELS: 'blocked'
          EVENT_NAME: ${{ github.event_name }}
          # pull_request 用。merge_group では両方とも空になる。
          PR_LABELS_EVENT: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          # merge_group 用。`refs/heads/gh-readonly-queue/<base>/pr-<番号>-<base sha>`。
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "merge_group" ]; then
            # prefix と最小 sha 長まで固定する。`^.*/pr-<数字>-<hex>$` だけだと
            # `refs/heads/my/pr-5-decade` のような無関係な ref も 5 にマッチし、
            # フォーマットが変わったとき「fail せず誤った PR のラベルを読む」に転ぶ。
            # base に `/` を含む形・base 自体が `pr-N-hex` で終わる形・大文字 sha は
            # いずれもこの式で正しく抜ける。
            PR_NUMBER="$(printf '%s' "$MERGE_GROUP_HEAD_REF" \
              | sed -n 's|^refs/heads/gh-readonly-queue/.*/pr-\([0-9][0-9]*\)-[0-9a-fA-F]\{7,\}$|\1|p')"
            if [ -z "$PR_NUMBER" ]; then
              # 判定不能は pass ではなく fail にする。素通りさせるとキューの中身が
              # 無検査でマージされるためで、fail なら GitHub が当該 entry をキューから
              # 外し、再投入で測り直せる。
              echo "::error title=Merge group ref is unparsable::head_ref='${MERGE_GROUP_HEAD_REF}' から PR 番号を取り出せませんでした。"
              exit 1
            fi
            # secondary rate limit / 一時的な 5xx / ネットワーク断で即 fail にすると、
            # ラベルが無い PR でも entry がキューから外れる。fail-safe の向き
            # （最終的に取れなければ fail）は変えずに、3 回までバックオフ再試行する。
            PR_LABELS=""
            for attempt in 1 2 3; do
              if PR_LABELS="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')"; then
                break
              fi
              PR_LABELS=""
              if [ "$attempt" -lt 3 ]; then
                echo "ラベル取得に失敗しました (${attempt}/3)。$((attempt * 5)) 秒待って再試行します。"
                sleep "$((attempt * 5))"
              fi
            done
            if [ -z "$PR_LABELS" ]; then
              echo "::error title=Label lookup failed::PR #${PR_NUMBER} のラベルを 3 回取得できませんでした。"
              exit 1
            fi
          else
            PR_NUMBER="$PR_NUMBER_EVENT"
            PR_LABELS="$PR_LABELS_EVENT"
          fi

          matched="$(jq -rn \
            --argjson labels "$PR_LABELS" \
            --arg blocking "$BLOCKING_LABELS" '
              ($blocking
                | split(",")
                | map(ascii_downcase | gsub("^\\s+|\\s+$"; ""))
                | map(select(length > 0))) as $block
              | $labels
              | map(ascii_downcase | gsub("^\\s+|\\s+$"; ""))
              | map(select(IN($block[])))
              | unique
              | join(", ")
            ')"

          if [ -z "$matched" ]; then
            echo "マージ阻止ラベルは付いていません（監視対象: ${BLOCKING_LABELS}）。"
            {
              echo "### Blocked label guard: pass"
              echo
              echo "PR #${PR_NUMBER} にマージ阻止ラベル（\`${BLOCKING_LABELS}\`）は付いていません。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Blocked label guard: fail"
            echo
            echo "PR #${PR_NUMBER} にマージ阻止ラベルが付いています: \`${matched}\`"
            echo
            echo "このチェックは、未解決の指摘を抱えた PR がラベルを見落とされてマージされる事故"
            echo "（#1746 / #1761）の再発防止です。ラベルが付いている間はマージできません。"
            echo
            echo "**ラベルを外すのは指摘した側です。** マージする側が自分で外してはいけません"
            echo "（docs/governance.md「PR レビューとマージ」を参照）。"
            echo "指摘へ対応したら、対応内容を PR にコメントしてラベル除去を依頼してください。"
            echo "ラベルが外れると、このチェックは次のイベントで自動的に再評価されます。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Merge blocked by label::PR #${PR_NUMBER} にマージ阻止ラベル (${matched}) が付いています。ラベルを外すのは指摘した側です（docs/governance.md）。マージする側が外してはいけません。"
          exit 1
