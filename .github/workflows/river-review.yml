name: River Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: river-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  river-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'river-review')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - name: Run River Review (midstream)
        uses: ./runners/github-action
        with:
          phase: midstream
          dry_run: false # LLM review enabled (Stage1: label opt-in)
          debug: true
          gate: false # advisory only — never fail the job
          max_cost: '0.50' # safety cap (OPENAI_MODEL とセットで有効)
        env:
          # GitHub Models は 2026-07-30 にretire済み。repository standardの
          # OpenAI secret + core default endpointへ戻す。secret未設定時は
          # review-engineの既存 fail-closed skip reason が明示される。
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RIVER_OPENAI_MODEL: gpt-4o-mini
          # max_cost 見積器も同じモデル名を参照する。
          OPENAI_MODEL: gpt-4o-mini
      # #1600: the CLI auto-saves a run record (findings + calibration debug —
      # verifierStats/verifierAllRejected/findingFormat.recommendedGaps) to
      # .river/runs/*.json under GITHUB_ACTIONS, but nothing uploaded it as a
      # CI artifact, so calibration data was unobservable outside the runner.
      # if: always() — a NO_GO/rejected run is exactly when this debug data is
      # most useful. Short retention: this is calibration telemetry, not an
      # audit record (see docs/development/pipeline-params-checklist.md
      # trust-boundary note in result-store.mjs for why it is not tamper-evident).
      - name: Upload review run debug JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: river-review-run-${{ github.event.pull_request.number || 'dispatch' }}-${{ github.run_id }}
          path: .river/runs/*.json
          if-no-files-found: warn
          retention-days: 7
