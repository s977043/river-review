name: Temp Validate Phase3 Security Audit Coverage

on:
  push:
    branches:
      - feat/2267-security-audit-coverage
    paths:
      - .github/workflows/phase3-security-audit-coverage-temp.yml

permissions:
  contents: write

jobs:
  validate-phase3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2267-security-audit-coverage
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Align Phase 3 semantics and prose
        env:
          REPLACEMENT_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          skill = Path('skills/agent-skills/river-review-security-audit/SKILL.md')
          text = skill.read_text()
          start = text.index('### 8. Record observe-only SecurityAuditCoverage')
          end = text.index('## Output Contract', start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '- No `SecurityAuditCoverage complete == safe` inference.\n',
              '- No coverage counters or empty `openUnitIds` == safe inference.\n',
          )
          skill.write_text(text)

          doc = Path('docs/development/2267-phase3-security-audit-coverage.md')
          prose = doc.read_text()
          prose = prose.replace(
              'The coverage record carries the Phase 2 `taxonomyVersion` explicitly so a later run can detect taxonomy drift instead of silently interpreting an old ledger with new meanings.',
              'The coverage record carries the Phase 2 `taxonomyVersion` explicitly. A later run can detect taxonomy drift instead of silently interpreting an old ledger with new meanings.',
          )
          prose = prose.replace(
              'Do not execute target-controlled builds, tests, browsers, fuzzers, package scripts, or external probes to improve coverage numbers.',
              'Do not execute target-controlled builds or tests to improve coverage numbers. Do not use browsers or fuzzers. Do not run package scripts or external probes for that purpose.',
          )
          doc.write_text(prose)
          PY

      - name: Normalize Phase 3 files
        run: |
          npm run fix:dashes
          npx prettier --write \
            schemas/security-audit-coverage.schema.json \
            src/lib/security-audit-coverage.mjs \
            tests/security-audit-coverage.test.mjs \
            tests/helpers/schema-validator.mjs \
            docs/development/2267-phase3-security-audit-coverage.md \
            skills/agent-skills/river-review-security-audit/SKILL.md
          npm run check:dashes

      - name: Regenerate skill-derived artifacts
        run: |
          npm run skills:manifest
          npm run skills:catalog
          npm run skills:registry

      - name: Run targeted tests
        run: node --experimental-test-isolation=none --test tests/security-audit-coverage.test.mjs tests/security-attack-class-registry.test.mjs

      - name: Validate skills and generated artifacts
        run: |
          npm run agent-skills:validate
          npm run skills:validate:refs
          npm run skills:manifest:check
          npm run skills:catalog:check
          npm run skills:registry:check

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/security-audit-coverage.schema.json \
            src/lib/security-audit-coverage.mjs \
            tests/security-audit-coverage.test.mjs \
            tests/helpers/schema-validator.mjs \
            docs/development/2267-phase3-security-audit-coverage.md \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            docs/data/skill-manifest.json \
            pages/reference/skills-catalog.md \
            skills/registry.yaml
          if git diff --cached --quiet; then
            echo "No normalized changes to commit."
            exit 0
          fi
          git commit -m "chore(security): normalize phase3 coverage artifacts"
          git push origin HEAD:feat/2267-security-audit-coverage
