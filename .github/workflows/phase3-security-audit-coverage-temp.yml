name: Temp Validate Phase3 Security Audit Coverage

on:
  push:
    branches:
      - feat/2267-security-audit-coverage
    paths:
      - .github/workflows/phase3-security-audit-coverage-temp.yml

permissions:
  contents: write

jobs:
  validate-phase3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2267-security-audit-coverage
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Align Phase 3 audit skill semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('skills/agent-skills/river-review-security-audit/SKILL.md')
          text = path.read_text()
          start = text.index('### 8. Record observe-only SecurityAuditCoverage')
          end = text.index('## Output Contract', start)
          replacement = '''### 8. Record observe-only SecurityAuditCoverage

Use `schemas/security-audit-coverage.schema.json` and `src/lib/security-audit-coverage.mjs` as the semantic coverage contract.
The unit is:

```text
subsystem × trustBoundary × attackClassId
```

Use only the closed unit state vocabulary:

```text
planned | covered | blocked | deferred | out_of_scope
```

Rules:

- `covered` requires traceable `reviewedPaths` and structured `evidenceRefs`.
- finding lifecycle is separate; `relatedFindingIds` is traceability only and never determines coverage state.
- `blocked` and `deferred` require an explanation plus a concrete validation plan.
- `out_of_scope` requires an explicit reason and explanation.
- zero findings alone never produces `covered`.
- reviewer execution success alone never produces `covered`.
- the ledger emits counters and `openUnitIds`, not a security-complete verdict.

Do not merge this ledger with #2212 `ReviewCoverage`.
Do not feed this observe-only telemetry into Gate behavior in Phase 3.

### 9. Report without claiming safety

A `full-audit` run means repository-wide source investigation was attempted.
It does not mean all security attack classes were proven safe.

Never translate coverage counters, an empty `openUnitIds`, or zero findings into `secure`, `safe`, `no vulnerabilities`, or an equivalent guarantee.

'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '- No `SecurityAuditCoverage complete == safe` inference.\n',
              '- No coverage counters or empty `openUnitIds` == safe inference.\n',
          )
          path.write_text(text)
          PY

      - name: Normalize Phase 3 files
        run: |
          npm run fix:dashes
          npx prettier --write \
            schemas/security-audit-coverage.schema.json \
            src/lib/security-audit-coverage.mjs \
            tests/security-audit-coverage.test.mjs \
            tests/helpers/schema-validator.mjs \
            docs/development/2267-phase3-security-audit-coverage.md \
            skills/agent-skills/river-review-security-audit/SKILL.md
          npm run check:dashes

      - name: Regenerate skill-derived artifacts
        run: |
          npm run skills:manifest
          npm run skills:catalog
          npm run skills:registry

      - name: Run targeted tests
        run: node --experimental-test-isolation=none --test tests/security-audit-coverage.test.mjs tests/security-attack-class-registry.test.mjs

      - name: Validate skills and generated artifacts
        run: |
          npm run agent-skills:validate
          npm run skills:validate:refs
          npm run skills:manifest:check
          npm run skills:catalog:check
          npm run skills:registry:check

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/security-audit-coverage.schema.json \
            src/lib/security-audit-coverage.mjs \
            tests/security-audit-coverage.test.mjs \
            tests/helpers/schema-validator.mjs \
            docs/development/2267-phase3-security-audit-coverage.md \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            docs/data/skill-manifest.json \
            pages/reference/skills-catalog.md \
            skills/registry.yaml
          if git diff --cached --quiet; then
            echo "No normalized changes to commit."
            exit 0
          fi
          git commit -m "chore(security): normalize phase3 coverage artifacts"
          git push origin HEAD:feat/2267-security-audit-coverage
