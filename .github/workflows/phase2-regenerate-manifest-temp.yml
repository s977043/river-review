name: Temp Regenerate Phase2 Skill Manifest

on:
  push:
    branches:
      - feat/2267-security-attack-class-registry
    paths:
      - .github/workflows/phase2-regenerate-manifest-temp.yml

permissions:
  contents: write

jobs:
  regenerate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2267-security-attack-class-registry
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Regenerate skill manifest
        run: npm run skills:manifest

      - name: Validate generated manifest
        run: npm run skills:manifest:check

      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/skill-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore(security): refresh phase2 skill manifest"
          git push origin HEAD:feat/2267-security-attack-class-registry
