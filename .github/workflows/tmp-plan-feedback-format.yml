name: Temporary Formatting Snapshot (remove before merge)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-snapshot:
    if: github.head_ref == 'feat/validated-plan-feedback-projection-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install formatting tools
        run: npm ci --ignore-scripts
      - name: Emit Prettier formatted source as base64 (read only)
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const files = [
            'docs/review/interactive-plan-feedback.md',
            'src/lib/output-formatters/html.mjs',
            'src/lib/plan-feedback-projection.mjs',
            'tests/plan-feedback-projection.test.mjs'
          ];
          for (const file of files) {
            const input = readFileSync(file);
            const result = spawnSync('./node_modules/.bin/prettier', ['--stdin-filepath', file], {
              input, encoding: 'utf8', maxBuffer: 10 * 1024 * 1024
            });
            if (result.status !== 0) throw new Error(file + ': ' + result.stderr);
            process.stdout.write('FORMATTED_FILE ' + file + ' ' +
              Buffer.from(result.stdout, 'utf8').toString('base64') + '\n');
          }
          NODE
