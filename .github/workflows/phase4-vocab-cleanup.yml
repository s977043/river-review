name: Phase 4 vocabulary cleanup

on:
  push:
    branches:
      - feat/2278-security-coverage-critic

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2278-security-coverage-critic
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Remove Phase 4 ad-hoc vocabulary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path('skills/agent-skills/unknown-coverage-review/references/SECURITY-AUDIT-PROFILE.md')
          text = profile.read_text()
          old = '''Suggested output:

          ```text
          category: security-audit-coverage
          kind: missing_surface
          coverageUnit: <expected subsystem × trustBoundary × attackClassId>
          evidence_missing: <what investigation evidence is absent>
          resolution: <minimum source-only investigation needed>
          ```
          '''
          old = old.replace('          ', '')
          new = '''Suggested output using the existing Unknown Coverage fields only:

          ```text
          category: Security / Data
          severity: <existing River Review severity based on residual risk>
          blocking: <true | false>
          evidence_missing: <missing investigation evidence, including the expected subsystem × trustBoundary × attackClassId when relevant>
          resolution: <minimum source-only investigation needed>
          ```

          Encode the expected semantic unit inside `evidence_missing` or `resolution`; do not add profile-specific output fields.
          '''
          new = new.replace('          ', '')
          if old not in text:
              raise SystemExit('expected SECURITY-AUDIT-PROFILE block not found')
          profile.write_text(text.replace(old, new))

          skill = Path('skills/agent-skills/river-review-security-audit/SKILL.md')
          text = skill.read_text()
          old = 'Coverage critic: not-run | report-only\n'
          if old not in text:
              raise SystemExit('expected coverage critic header line not found')
          skill.write_text(text.replace(old, ''))
          PY

      - name: Regenerate skill artifacts
        run: |
          npm run skills:catalog
          npm run skills:manifest

      - name: Remove temporary workflow
        run: rm .github/workflows/phase4-vocab-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(security): keep phase4 coverage critic vocabulary existing'
          git push origin HEAD:feat/2278-security-coverage-critic
