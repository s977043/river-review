name: Temporary Phase 5.5 Review Prettier

on:
  push:
    branches:
      - feat/2252-api-compatibility-signals
    paths:
      - .github/workflows/tmp-prettier-phase5-5-review.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2252-api-compatibility-signals
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format reviewed files
        run: npx prettier --write src/lib/api-compatibility-signals.mjs tests/api-compatibility-signals.test.mjs
      - name: Verify scope and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/lib/api-compatibility-signals.mjs tests/api-compatibility-signals.test.mjs | sort)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api-compatibility-signals.mjs tests/api-compatibility-signals.test.mjs
          git commit -m "style(viewpoints): format reviewed signal detector"
          git push origin HEAD:feat/2252-api-compatibility-signals
