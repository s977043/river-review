name: Temporary Phase 6 Review Fixes v2

on:
  push:
    branches:
      - feat/2252-review-viewpoints-active-mode
    paths:
      - .github/workflows/tmp-phase6-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2252-review-viewpoints-active-mode
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply review fixes
        run: python scripts/tmp-phase6-review-fixes.py
      - name: Format
        run: npx prettier --write src/lib/review-viewpoint-stage.mjs pages/reference/config-schema.md pages/reference/config-schema.en.md docs/development/2252-review-viewpoint-knowledge-design.md tests/review-viewpoint-active-mode.test.mjs tests/review-viewpoint-stage.test.mjs
      - name: Verify
        run: |
          node --test tests/review-viewpoint-stage.test.mjs tests/review-viewpoint-active-mode.test.mjs tests/prompt-review-request.test.mjs tests/prompt-compiler.test.mjs tests/prompt-compiler-observe.test.mjs tests/prompt-sections.test.mjs
          npm run lint
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/review-viewpoint-stage.mjs pages/reference/config-schema.md pages/reference/config-schema.en.md docs/development/2252-review-viewpoint-knowledge-design.md tests/review-viewpoint-active-mode.test.mjs tests/review-viewpoint-stage.test.mjs
          git commit -m "docs(viewpoints): document runtime modes and trust boundary"
          git push origin HEAD:feat/2252-review-viewpoints-active-mode
