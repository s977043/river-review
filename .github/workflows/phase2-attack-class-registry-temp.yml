name: Temp Wire Phase2 Attack Class Registry

on:
  push:
    branches:
      - feat/2267-security-attack-class-registry
    paths:
      - .github/workflows/phase2-attack-class-registry-temp.yml

permissions:
  contents: write

jobs:
  wire-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2267-security-attack-class-registry
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Wire attack class registry into audit skill
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('skills/agent-skills/river-review-security-audit/SKILL.md')
          text = path.read_text()

          replacements = [
              ('version: 0.1.0', 'version: 0.2.0'),
              ('- semantic `SecurityAuditCoverage`: Phase 2 follow-up of #2267',
               '- semantic `SecurityAuditCoverage`: Phase 3 follow-up of #2267'),
              (
                  'Reconnaissance is an investigation plan, not proof of safety.\n\n### 3. Reuse existing security skills',
                  '''Reconnaissance is an investigation plan, not proof of safety.\n\n### 3. Plan applicable attack classes\n\nUse `references/attack-classes.json` as the taxonomy SSoT for audit planning.\nSelect only classes supported by reconnaissance evidence; do not run all classes mechanically.\nFor every applicable class, preserve the registry evidence contract:\n\n```text\nprincipal\n  -> input or action\n  -> control or missing control\n  -> trust boundary\n  -> affected resource or principal\n  -> concrete security outcome\n```\n\nAn attack class is an investigation hypothesis, not a checklist completion badge.\nA class with zero findings is not automatically covered, and a non-applicable class must be explained rather than silently omitted.\n`SecurityAuditCoverage` will consume this taxonomy in a later phase; this skill does not emit semantic coverage status yet.\n\n### 4. Reuse existing security skills'''
              ),
              ('### 4. Treat findings as evidence-grounded candidates',
               '### 5. Treat findings as evidence-grounded candidates'),
              ('### 5. Preserve verification boundaries',
               '### 6. Preserve verification boundaries'),
              ('### 6. Record unresolved hypotheses explicitly',
               '### 7. Record unresolved hypotheses explicitly'),
              ('### 7. Report without claiming unsupported coverage',
               '### 8. Report without claiming unsupported coverage'),
              ('- `docs/development/2267-phase0-gap-analysis.md`\n',
               '- `docs/development/2267-phase0-gap-analysis.md`\n- `skills/agent-skills/river-review-security-audit/references/attack-classes.json`\n')
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected text not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Regenerate skill-derived artifacts
        run: |
          npm run skills:registry
          npm run skills:catalog
          npm run skills:manifest

      - name: Validate Phase 2 registry
        run: |
          node --experimental-test-isolation=none --test tests/security-attack-class-registry.test.mjs
          npm run agent-skills:validate
          npm run skills:registry:check
          npm run skills:catalog:check
          npm run skills:manifest:check

      - name: Commit wired skill and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/agent-skills/river-review-security-audit/SKILL.md \
            skills/registry.yaml \
            pages/reference/skills-catalog.md \
            docs/data/skill-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(security): wire attack class registry into audit skill"
          git push origin HEAD:feat/2267-security-attack-class-registry
