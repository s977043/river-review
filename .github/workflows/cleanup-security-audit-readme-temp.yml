name: Temp Cleanup Security Audit README Diff

on:
  push:
    branches:
      - feat/2267-security-audit-entry-skill
    paths:
      - .github/workflows/cleanup-security-audit-readme-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/2267-security-audit-entry-skill
          fetch-depth: 0

      - name: Restore README baselines and keep only audit-skill enumeration
        run: |
          git fetch origin main
          git checkout origin/main -- README.md README.en.md
          python - <<'PY'
          from pathlib import Path

          ja = Path('README.md')
          text = ja.read_text()
          old = '- スキル: オーケストレーターの `river-review` に加えて `river-review-code` / `river-review-security` / `river-review-performance` の各スキルが含まれる。さらに `river-review-architecture` / `river-review-testing` / `river-review-frontend` も含まれる。加えて `river-review-docs` / `adversarial-review` / `review-team` / `unknown-coverage-review` も含まれる。いずれも `/river-review:<skill-name>` で呼び出せる'
          new = '- スキル: オーケストレーターの `river-review` に加えて `river-review-code` / `river-review-security` / `river-review-security-audit` / `river-review-performance` の各スキルが含まれる。さらに `river-review-architecture` / `river-review-testing` / `river-review-frontend` も含まれる。加えて `river-review-docs` / `adversarial-review` / `review-team` / `unknown-coverage-review` も含まれる。いずれも `/river-review:<skill-name>` で呼び出せる'
          if old not in text:
              raise SystemExit('Japanese skill enumeration baseline not found')
          ja.write_text(text.replace(old, new, 1))

          en = Path('README.en.md')
          text = en.read_text()
          old = '- Skills: the orchestrator `river-review` plus `river-review-code`, `river-review-security`, `river-review-performance`, `river-review-architecture`, `river-review-testing`, `river-review-frontend`, `river-review-docs`, `adversarial-review`, `review-team`, and `unknown-coverage-review` — addressable as `/river-review:<skill-name>`'
          new = '- Skills: the orchestrator `river-review` plus `river-review-code`, `river-review-security`, `river-review-security-audit`, `river-review-performance`, `river-review-architecture`, `river-review-testing`, `river-review-frontend`, `river-review-docs`, `adversarial-review`, `review-team`, and `unknown-coverage-review` — addressable as `/river-review:<skill-name>`'
          if old not in text:
              raise SystemExit('English skill enumeration baseline not found')
          en.write_text(text.replace(old, new, 1))
          PY

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-security-audit-readme-temp.yml
          git add README.md README.en.md
          git commit -m "docs: keep security audit README diff scoped"
          git push origin HEAD:feat/2267-security-audit-entry-skill
