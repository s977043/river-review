name: Auto Fix Dashes

on:
  schedule:
    - cron: '0 3 * * 6' # Every Saturday 03:00 UTC (6:00 JST)

permissions: read-all

concurrency:
  group: auto-fix-dashes
  cancel-in-progress: false

jobs:
  auto-fix-dashes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-deps

      - name: Run fix-dashes
        run: npm run fix:dashes

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(docs): auto-fix dash spacing'
          title: 'chore(docs): auto-fix dash spacing'
          body: |
            Automated PR created by scheduled workflow to normalize dash spacing (`scripts/fix-dashes.mjs`).
            Please review the changes and merge if acceptable.
          branch: 'auto/fix-dashes-automation'
